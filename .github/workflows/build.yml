name: Build
on:
  push:
    branches:
      - main
    tags:
      - v** # Push events to any tag starting with a 'v': v1.1.0, v2.x ...
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build -t shinycannon-build .
      - name: Run Docker
        run: docker run -v $PWD:/workdir shinycannon-build make packages
      - name: Show created artifacts
        run: ls out
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -x
          assets=()
          for asset in ./out/*; do
            assets+=("$asset")
          done
          tag_name="${GITHUB_REF##*/}"
          gh release create "$tag_name" --title "$tag_name" "${assets[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
